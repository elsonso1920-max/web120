<!doctype html>
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Recorrido virtual · INSM</title><meta name="description" content="Recorrido virtual del Instituto Nuestra Señora de la Merced."><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#071a35;color:#fff}.scene{position:relative;height:100%;width:100%;overflow:hidden}.scene img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;transition:opacity .5s,transform 1s}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,26,53,.05),rgba(7,26,53,.8))}.ui{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#d8ff63}.title{font-size:clamp(28px,4vw,54px);font-weight:800;line-height:.9;margin:8px 0}.desc{max-width:390px;color:#d4dfed;font-size:14px}.bottom{display:flex;align-items:end;justify-content:space-between;gap:20px}.dots{display:flex;gap:7px;flex-wrap:wrap}.dot{border:1px solid rgba(255,255,255,.35);background:rgba(7,26,53,.45);color:#fff;border-radius:999px;padding:9px 12px;cursor:pointer;font-size:11px}.dot.active{background:#d8ff63;color:#071a35;border-color:#d8ff63}.hint{font-size:11px;color:#c8d6e6;text-transform:uppercase;letter-spacing:.1em}.hotspot{position:absolute;z-index:4;width:18px;height:18px;border:2px solid #d8ff63;border-radius:50%;background:#071a35;box-shadow:0 0 0 8px rgba(216,255,99,.12);cursor:pointer;transition:.25s}.hotspot:hover{transform:scale(1.3)}@media(max-width:650px){.ui{padding:16px}.desc{font-size:12px}.hint{display:none}.dot{padding:8px 9px}}
</style><meta content="noindex,nofollow,noarchive" name="robots"/></head><body><div class="scene"><img decoding="async" loading="lazy" alt="Espacio del INSM" id="photo" src="../img/entrada.webp" width="1366" height="697"/><div class="hotspot" data-scene="Entrada" style="left:42%;top:52%" title="Entrada"></div><div class="hotspot" data-scene="Convivencia" style="left:67%;top:43%" title="Comunidad"></div><div class="hotspot" data-scene="Informática" style="left:27%;top:40%" title="Informática"></div><div class="ui"><div class="top"><div><div class="eyebrow">RECORRIDO VIRTUAL · INSM</div><div class="title" id="title">Entrada</div><div class="desc" id="desc">Comenzá el recorrido por algunos de los espacios que forman parte de nuestra comunidad.</div></div><div class="eyebrow">↗ EXPLORAR</div></div><div class="bottom"><div class="dots" id="dots"></div><div class="hint">Elegí un espacio para moverte</div></div></div></div><script>const scenes=[['Entrada','../img/entrada.webp','Comenzá el recorrido por algunos de los espacios que forman parte de nuestra comunidad.'],['Comunidad','../img/Convivencia.webp','Espacios de encuentro donde la convivencia y la participación forman parte de la vida institucional.'],['Informática','../img/Informatica 3.webp','Tecnología, proyectos y producción digital como parte de las experiencias de aprendizaje.'],['Arte','../img/Literatura.webp','La producción artística y cultural abre otras formas de mirar, expresar y compartir.'],['Deporte','../img/Deporte 1.webp','El movimiento, el juego y el deporte también construyen comunidad.'],['Historia','../img/Historia.webp','Una mirada a la trayectoria que acompaña al INSM desde 1887.']];const dots=document.getElementById('dots'),photo=document.getElementById('photo'),title=document.getElementById('title'),desc=document.getElementById('desc');let idx=0;scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.textContent=s[0];b.onclick=()=>show(i);dots.appendChild(b)});function show(i){idx=i;const s=scenes[i];photo.style.opacity=.25;photo.style.transform='scale(1.06)';setTimeout(()=>{photo.src=s[1];title.textContent=s[0];desc.textContent=s[2];photo.style.opacity=1;photo.style.transform='scale(1)'},180);[...dots.children].forEach((b,n)=>b.classList.toggle('active',n===i))}show(0);document.querySelectorAll('.hotspot').forEach(h=>h.onclick=()=>show(Math.max(0,scenes.findIndex(s=>s[0]===h.dataset.scene)||0)));</script></body></html>
